name: Build hdk_probe kernel module (Mint 1413 a50)

on:
  workflow_dispatch:
  push:
    branches:
      - "hdk/**"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source + hdk module (fork, branch hdk/probe-1413)
        # Ветка hdk/probe-1413 в форке vssfeo = тег xbeta-1413_a50dx
        # + tools/iiod/kernel/hdk_probe.c (наш модуль).
        uses: actions/checkout@v4
        with:
          ref: hdk/probe-1413
          fetch-depth: 1
          submodules: recursive   # KernelSU подмодуль (drivers/kernelsu/Kconfig)

      - name: Update apt & install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 lib32stdc++6 libc6-dev-i386 libncurses5 jq \
            gcc-arm-linux-gnueabi

      - name: Get Proton Clang 13 toolchain (as Mint build.sh does)
        run: |
          mkdir -p "${{ github.workspace }}/toolchain"
          git clone \
            'https://gitlab.com/TenSeventy7/exynos9610_toolchains_fresh.git' \
            "${{ github.workspace }}/toolchain" \
            --single-branch -b proton --depth 1
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/toolchain/lib:$LD_LIBRARY_PATH"
          clang --version | head -1
          ls "${{ github.workspace }}/toolchain/bin" | grep -E 'aarch64-linux-gnu-(ld|as|objcopy)$'

      - name: Generate kernel config (device config + core overlay)
        # exynos9610-a50_default_defconfig ПОБАЙТОВО совпадает с /proc/config.gz
        # со стенда (5758 строк, 0 различий) и содержит CONFIG_LTO_NONE=y.
        # core_defconfig добавляет недостающие опции (LITTLE/BIG_CPU_MASK),
        # которые ядро реально использует (8 ядер: 4 LITTLE + 4 BIG).
        # Порядок: сначала default, поверх — core (core важнее).
        run: |
          set -o pipefail
          cat arch/arm64/configs/exynos9610-a50_default_defconfig > .config
          cat arch/arm64/configs/exynos9610-a50_core_defconfig >> .config
          grep -E '^CONFIG_LTO_NONE|^CONFIG_ARM64_VA_BITS=|^CONFIG_LITTLE_CPU_MASK|^CONFIG_BIG_CPU_MASK|^CONFIG_MODULES=' .config

      - name: Prepare kernel build tree
        run: |
          set -o pipefail
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/toolchain/lib:$LD_LIBRARY_PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export ANDROID_MAJOR_VERSION=r PLATFORM_VERSION=11.0.0
          # ВАЖНО: CC/HOSTCC передаются в командной строке make (как в
          # build.sh Mint), а не через export: иначе Makefile при отсутствии
          # CONFIG_CC_IS_CLANG ставит CC=$(CROSS_COMPILE)gcc (которого нет).
          make olddefconfig \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LOCALVERSION=" - Mint Beta 1413" 2>&1 | tee /tmp/defconfig.log | tail -6
          # NEW-опции (их нет ни в одном дефконфиге) — добираем из core_defconfig.
          grep -oE '[A-Za-z0-9_]+ \(NEW\)' /tmp/defconfig.log | sed 's/ (NEW)//' | sort -u > /tmp/new_syms.txt || true
          if [ -s /tmp/new_syms.txt ]; then
            echo "NEW-символы: $(tr '\n' ' ' < /tmp/new_syms.txt)"
            while read -r sym; do
              [ -z "$sym" ] && continue
              val=$(grep -E "^CONFIG_${sym}=" arch/arm64/configs/exynos9610-a50_core_defconfig | tail -1)
              if [ -n "$val" ]; then
                echo "$val" >> .config; echo "дописано: $val"
              else
                echo "!! нет значения для CONFIG_${sym}"; exit 1
              fi
            done < /tmp/new_syms.txt
            make olddefconfig \
              CC=clang HOSTCC=clang HOSTCXX=clang++ \
              AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
              LOCALVERSION=" - Mint Beta 1413" 2>&1 | tee /tmp/defconfig2.log | tail -4
          fi
          grep -E '^CONFIG_CC_IS_CLANG|^CONFIG_LTO_NONE|^CONFIG_LITTLE_CPU_MASK|^CONFIG_BIG_CPU_MASK' .config || true
          make -j$(nproc) modules_prepare \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LOCALVERSION=" - Mint Beta 1413" 2>&1 | tee /tmp/prepare.log | tail -8

      - name: Build vmlinux (generates Module.symvers for CONFIG_MODVERSIONS)
        # Ядро на стенде собрано с CONFIG_MODVERSIONS=y, а Symbol version dump
        # нужен для CRC-совпадения модуля при insmod (иначе Exec format error).
        # Module.symvers появляется только при полной сборке объектов (vmlinux).
        run: |
          set -o pipefail
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/toolchain/lib:$LD_LIBRARY_PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export ANDROID_MAJOR_VERSION=r PLATFORM_VERSION=11.0.0
          make -j$(nproc) vmlinux \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LOCALVERSION=" - Mint Beta 1413" 2>&1 | tee /tmp/vmlinux.log | tail -8
          ls -la Module.symvers
          head -5 Module.symvers

      - name: Build hdk_probe.ko
        run: |
          set -o pipefail
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/toolchain/lib:$LD_LIBRARY_PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export ANDROID_MAJOR_VERSION=r PLATFORM_VERSION=11.0.0
          # CC/HOSTCC/AR передаются в командной строке make (как в build.sh Mint)
          make M="${{ github.workspace }}/tools/iiod/kernel" modules \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LOCALVERSION=" - Mint Beta 1413" 2>&1 | tail -30
          ls -la "${{ github.workspace }}/tools/iiod/kernel/hdk_probe.ko"
          # проверка vermagic модуля
          strings "${{ github.workspace }}/tools/iiod/kernel/hdk_probe.ko" | grep -E 'vermagic' | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdk-kernel-modules
          path: |
            tools/iiod/kernel/hdk_probe.ko
            tools/iiod/kernel/hdk_sensor_core.ko
          if-no-files-found: error